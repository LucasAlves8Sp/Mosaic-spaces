    relationship: "background"
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    Formalized and Comparator-checked: the 70 statements listed under alignment; supporting
    library results are listed in docs/COVERAGE_LEDGER.md. NOT formalized: Section 3 (E(Y), the
    arcless continuum) and Appendix A; Section 5's van Douwen space (Lemma 5.1, Proposition 5.3);
    Example 7.3 (cZ); the strictness claims of Theorem 7.4 other than (LmS) =/=> (H) and
    LAC =/=> (H); Curtis's example (Remark 3.7) and the space HE (Section 5.1), which the article
    cites; the Hahn-Mazurkiewicz theorem (not needed: Cor. 2.9(2) (c)=>(d) and Prop. 2.10 (d)=>(a)
    are proved without it). The excluded items are examples, left out at the author's request.
  # 0 in the library and Solution.lean. Challenge.lean has one `sorry` per compared statement
  # (70), which is the statement-file convention.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Fable 5.2", "Claude Opus 5.5"]
      framework: "Claude (Anthropic) agent sessions with file and shell tools"
      tool_setup: >-
        All Lean code was written by the models. A first session (Claude Fable 5.2) prepared the
        ledger, documentation and the first Section 2 modules. The session of 2026-11-16
        (Claude Opus 5.5) completed Section 2, wrote Sections 4, 6 and 7, the Challenge/Solution
        pair and the verification scripts; the session of 2026-11-17 (Claude Opus 5.5) added the
        arc theorem, local path connectedness of Peano continua, the Tychonoff property of G,
        Definition 2.1, Proposition 2.10, boundary bumping and the remaining Section 2, 4, 6 and 7
        results. Everything was compiled with Lake in a Linux cloud container (Lean v4.35.0-rc2,
        Mathlib built from source because the cache server was not reachable).
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "cloud container"
      prompting_notes: >-
        The human author supplied a detailed brief requiring Mathlib definitions where possible,
        no Hausdorff/first countable/metrizable assumptions, constructed counterexamples, no
        sorry or custom axioms, a coverage ledger and an honest report of what is not formalized.
  spend_usd: "not tracked"
  notes: >-
    The article was prepared with assistance from Claude Fable 5.2 and ChatGPT Astra, as declared
    in its closing section. The Lean statements and proofs were produced by Claude Fable 5.2 and
    Claude Opus 5.5. The human author has not written or reviewed Lean code.

fidelity:
  divergences: >-
    (1) Mosaic spaces are defined intrinsically (a coherent closed cover by compact metrizable
    subspaces); abstract Definition 2.1 is also formalized and proved equivalent (def_2_1_*).
    (2) Local properties are in open-set form; "locally path connected" is Mathlib's
    LocallyPathConnectedSpace (proved equivalent to the open-set form). (3) Q1a and Q1b are
    answered via the cone over G, not via E(K). (4) Fan(I) is realised in the product space
    I -> R; the article's metric phi is proved to induce exactly this topology (fan_metric).
    (5) G's points are an inductive type; its topology is the final topology of the piece maps.
    The witness (n,i) sits at 1/(i+1) with i starting at 0. (6) Statements about G and cG are
    existential; theorem_4_11 packs all properties of G for one witness. (7) Lemma 2.14 is also
    stated in a variant form (lemma_2_14). (8) In Proposition 2.10(c) the index type is in the
    universe of X; prop_2_10_quotient covers sums in any universe.

review:
  status: "self-assessed by the AI systems that wrote the code; no human review"
  reviewers:
    - "none"
  notes: >-
    No human has audited the Lean statements. Separate Claude agents (a sceptic and a referee,
    fresh contexts, read-only snapshots) reviewed statement fidelity; their findings and the
    responses are in reports/ai_adversarial_review.md. That is an AI review, not an independent
    human one. See reports/verification_report.md for the checks that were run, including which
    ran without the bwrap sandbox.

