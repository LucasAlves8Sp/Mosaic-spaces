# formalization.yaml v0.4.
version: "v0.4"

project:
  name: "Mosaic spaces generated by continua and by Peano continua"
  description: >-
    Lean 4 / Mathlib formalization of an article on Davison's mosaic spaces and three questions
    recorded by Lavallee (1964). Formalized: every theorem, lemma, proposition and corollary of
    Sections 2, 4, 6 and 7 and the classical facts they use (abstract Definition 2.1 and its
    equivalence with the intrinsic definition; the arc theorem; compact locally connected
    metrizable spaces are locally path connected; Proposition 2.10 on path-determined spaces), the
    space G (Tychonoff, locally arcwise connected, not a quasi-curve space), the cone construction,
    boundary bumping (Lemma 5.2), and the answers to all three questions: Q3 by G, Q2 and Q1a/Q1b
    by the cone over G. Not formalized (examples, excluded by the author's request): Section 3
    and the Appendix (the space E(K)), van Douwen's space in Section 5, Example 7.3 (cZ) and the
    strictness claims of Theorem 7.4 that use them; also the Hahn-Mazurkiewicz theorem, which no
    formalized result needs.
  authors:
    - "Lucas Alves de Almeida"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lucas Alves de Almeida"

classification:
  arxiv: ["math.GN"]
  msc2020: ["54D55", "54D05", "54F15", "54G20"]

